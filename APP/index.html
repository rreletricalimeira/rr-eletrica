<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RR Elétrica - Gestão</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="./src/ui/style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>
  <h1>RR Elétrica — Gestão</h1>
  <p class="subtitle">Protótipo: banco local (SQLite/WASM) + backup no Google Drive</p>

  <div class="card">
    <p id="status">Carregando...</p>
    <p id="ultimo-backup"></p>
  </div>

  <div class="card">
    <h2>Teste rápido — cadastrar cliente</h2>
    <input id="input-nome" placeholder="Nome do cliente" />
    <button id="btn-add-teste">Adicionar cliente</button>
    <ul id="clientes-lista"></ul>
  </div>

  <div class="card">
    <h2>Backup no Google Drive</h2>
    <button id="btn-login" class="secondary">Conectar ao Google</button>
    <button id="btn-backup">Fazer backup agora</button>
    <button id="btn-restore" class="secondary">Restaurar último backup</button>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
