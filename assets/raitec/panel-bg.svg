<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1622"/>
      <stop offset="55%" stop-color="#0d1e2d"/>
      <stop offset="100%" stop-color="#0a141c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123b52"/>
      <stop offset="100%" stop-color="#0a2433"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2e86e0" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#2e86e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="670" cy="80" r="1.6" fill="#fff" opacity=".7"/>
  <circle cx="120" cy="60" r="1.4" fill="#fff" opacity=".5"/>
  <circle cx="300" cy="40" r="1.2" fill="#fff" opacity=".6"/>
  <circle cx="500" cy="55" r="1.5" fill="#fff" opacity=".55"/>
  <circle cx="230" cy="110" r="1.1" fill="#fff" opacity=".4"/>
  <circle cx="600" cy="130" r="1.3" fill="#fff" opacity=".45"/>
  <circle cx="60" cy="150" r="1.2" fill="#fff" opacity=".4"/>

  <!-- casa ao fundo -->
  <g opacity=".85">
    <path d="M470 300 L560 240 L650 300 V400 H470 Z" fill="#050c12"/>
    <rect x="497" y="330" width="34" height="34" fill="#0a141c"/>
    <rect x="497" y="330" width="34" height="34" fill="url(#winGlow)"/>
    <rect x="565" y="330" width="34" height="34" fill="#0a141c"/>
    <rect x="565" y="330" width="34" height="34" fill="url(#winGlow)"/>
    <rect x="530" y="360" width="30" height="40" fill="#050c12"/>
  </g>

  <!-- vegetação -->
  <g opacity=".9" fill="#050c12">
    <path d="M40 400 C40 340 90 300 90 300 C90 300 140 340 140 400 Z"/>
    <path d="M10 400 C10 360 45 330 45 330 C45 330 80 360 80 400 Z"/>
    <path d="M700 400 C700 350 745 315 745 315 C745 315 790 350 790 400 Z"/>
    <ellipse cx="200" cy="398" rx="55" ry="18"/>
    <ellipse cx="650" cy="398" rx="70" ry="20"/>
  </g>

  <!-- piscina -->
  <rect x="0" y="400" width="800" height="200" fill="url(#water)"/>
  <rect x="0" y="400" width="800" height="200" fill="url(#glow)"/>
  <g stroke="#2e86e0" stroke-width="1.4" opacity=".35" fill="none">
    <path d="M0 440 Q100 430 200 440 T400 440 T600 440 T800 440"/>
    <path d="M0 475 Q100 465 200 475 T400 475 T600 475 T800 475"/>
    <path d="M0 515 Q100 505 200 515 T400 515 T600 515 T800 515"/>
    <path d="M0 555 Q100 545 200 555 T400 555 T600 555 T800 555"/>
  </g>
  <circle cx="230" cy="460" r="5" fill="#7fd4ff" opacity=".6"/>
  <circle cx="230" cy="460" r="14" fill="#7fd4ff" opacity=".15"/>
  <circle cx="560" cy="500" r="4" fill="#7fd4ff" opacity=".5"/>
  <circle cx="560" cy="500" r="12" fill="#7fd4ff" opacity=".12"/>

  <!-- vinheta -->
  <rect width="800" height="600" fill="#000" opacity=".12"/>
</svg>
